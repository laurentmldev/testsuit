# Setup of the toy-train tests on the lab (datapack side, sequencer README section 8).
# It says what each slot gets as inputs and how this test drives it; the lab inventory says
# where the lab components bound to the slots are.
#
# The sequencer fields (realms, realm, role) are kept in the datapack as written, for the sequencer
# to use at run time. A slot's role is a type of the lab: the slot binds to a lab component with that
# role, which gives the commands.

id: toytrain_setup
name: Toy train (simulated propulsion and sensors)

dictionaries:
  - globals.yml
  - "platforms/{{ testdef.setup_config }}.yml"   # what the platform changes: sim_bench (the lab) or emulated (a dev host)

datarepositories:
  - id: toytrain
    path: "{{ setup.path }}/../../.work/datarepo"
    datasources:
      - id: software
        name: Toy-train software (system under test)
        importer: toytrain-release            # the toytrain package's importer; 'git' for a git repository
        source: "{{ setup.path }}/../release_store/toytrain-sw"
        datasets:
          - id: toytrain_sw                   # keys: toytrain_sw.path, toytrain_sw.version
            version: "{{ toytrain_sw_version }}"
      - id: simulation
        name: Toy-train lab simulation
        importer: toytrain-release
        source: "{{ setup.path }}/../release_store/toytrain-sim"
        datasets:
          - id: toytrain_sim
            version: "{{ toytrain_sim_version }}"

slot_types:

  pilot_app:                                  # CALC-Pilot application
    role: pilot                                 # the inputs the lab role expects: app/ and pilot.yml
    configurations:
      standard:
        inputs:
          - {source: "{{ toytrain_sw.path }}/pilot/", target: app/, method: copy}   # MPU app + MCU firmware
          - {source: templates/pilot.yml, target: pilot.yml}

  telemetry_app:                              # CALC-TM application
    configurations:
      standard:
        inputs:
          - {source: "{{ toytrain_sw.path }}/telemetry/", target: app/, method: copy}
          - {source: templates/telemetry.yml, target: telemetry.yml}

  acquisition_app:                            # AU application
    configurations:
      standard:
        inputs:
          - {source: "{{ toytrain_sw.path }}/acquisition/", target: app/, method: copy}
          - {source: templates/acquisition.yml, target: acquisition.yml}

  propulsion_sim:
    configurations:
      standard:
        inputs:
          - {source: "{{ toytrain_sim.path }}/", target: sim/, method: copy}
          - {source: templates/propulsion_sim.yml, target: propulsion_sim.yml}

  piezo_sim:
    configurations:
      standard:
        inputs:
          - {source: "{{ toytrain_sim.path }}/", target: sim/, method: copy}
          - {source: templates/piezo_sim.yml, target: piezo_sim.yml}

  exploit:                                    # exploitation with testsuit's exploit_runner
    configurations:
      standard:
        inputs:
          - {source: templates/exploit.yml, target: exploit.yml}
          - {source: "{{ testdef.path }}/criteria/", target: scenario/toytrain/, method: copy}
          - {source: scripts/check_data.py, target: check_data.py, method: copy}   # a python step (testdef pipeline)

# The datapack does not drive the train's switch: on the lab it is locked with its lab stage all the same.
configurations:
  sim_bench: &toytrain_slots                  # the lab: real calculators, simulated propulsion and sensors
    realms:
      train: {type: toytrain}                 # bound to train_1 (the only lab stage of this type)
    slots:
      pilot:       {name: CALC-Pilot, type: pilot_app, configuration: standard, realm: train, role: pilot}
      telemetry:   {name: CALC-TM, type: telemetry_app, configuration: standard, realm: train, role: telemetry}
      acquisition: {name: AU, type: acquisition_app, configuration: standard, realm: train, role: acquisition}
      propulsion:  {name: Simulated propulsion, type: propulsion_sim, configuration: standard, role: propulsion_sim}
      piezo:       {name: Simulated piezo sensors, type: piezo_sim, configuration: standard, role: piezo_sim}
      analysis:    {name: Exploitation, type: exploit, configuration: standard, role: sequencer}
  emulated: *toytrain_slots                   # a dev host: everything emulated by local processes (README, emulated mode)
