# Keys shared by every toy-train test: the system's characteristics and its network plan
# (the interface control document of the train, not of the lab).

train:
  speed_limit_mps: 0.5           # maximum speed allowed (pilot software limit)
  physical_max_mps: 1.0          # what the propulsion can technically reach
  pilot_profile:                 # nominal pilot behaviour
    start_speed_mps: 0.25
    start_hold_s: 5
    step_mps: 0.1
    step_period_s: 2

net:                             # addresses on the train network (same on the real train and in the lab;
                                 # the emulated mode changes them: platforms/emulated.yml)
  pilot: 10.42.0.10
  telemetry: 10.42.0.11
  acquisition: 10.42.0.12
  propulsion: 10.42.0.20         # real propulsion controller, or its simulation on the lab server
  lab_server: 10.42.0.1          # lab server (simulations), not on the real train
  propulsion_cmd_port: 5000      # UDP, commands to the propulsion controller
  multicast_group: 239.42.0.1
  speed_port: 5001               # UDP multicast, speed feedback from the propulsion controller (20 Hz)
  contact_port: 5002             # UDP multicast, contact events from the acquisition unit
  pilot_state_port: 5003         # UDP multicast, pilot state and last command

gpio:                            # acquisition unit inputs
  piezo_front: 17
  piezo_back: 27

# versions of what the datapack is built from (baseline, sequencer README section 5.3)
toytrain_sw_version: v0.3.0      # git tag of the toy-train software (system under test)
toytrain_sim_version: v1.1.0     # git tag of the simulation

datapack:
  output_dir: "{{ testdef.path }}/../../../.work/datapacks"
