# Front contact test: after 3 s at full speed, a simulated contact on the front piezo sensor;
# the train shall stop.
id: toytrain_front_contact
name: Front contact detection
description: A front contact after 3 s at full speed is detected and stops the train.
setup_file: ../../setup/toytrain_setup.yml
setup_config: sim_bench
dictionaries:
  - scenario.yml

# Pipeline run by the sequencer (README sections 8.3 and 8.4), kept as is in the datapack.
# Same pipeline for every toy-train test; the scenario dictionary makes the difference.
# The sequencer self-tests every bound component before the first phase (README section 7.5).
pipeline:
  timeout: 15m
  subpipelines:
    bring_up:                                    # deploy, then start everything, the pilot last
      steps:
        # deploy every input in parallel (default linux_system deploy: scp to <remote_root>/<slot>/input)
        - {id: deploy, for_each: slots, do: deploy}
        - {id: flash_pilot, slot: pilot, do: install, needs: [deploy]}
        # the simulation first: the calculators must find their peers when they start
        - {id: start_sims, for_each: [propulsion, piezo], do: start, needs: [deploy]}
        - {id: sims_ready, for_each: [propulsion, piezo], do: ready, needs: [start_sims]}
        - {id: start_tm, slot: telemetry, do: start, needs: [deploy]}
        - {id: tm_ready, slot: telemetry, do: ready, needs: [start_tm]}
        - {id: start_au, slot: acquisition, do: start, needs: [deploy, sims_ready]}
        - {id: au_ready, slot: acquisition, do: ready, needs: [start_au]}
        # rendez-vous: the pilot starts the train only when everything listens
        - {id: start_pilot, slot: pilot, do: start, needs: [flash_pilot, sims_ready, tm_ready, au_ready]}
        - {id: pilot_running, wait_for: {state: running, slot: pilot, timeout: 20s}, needs: [start_pilot]}

    shut_down:                                   # the pilot first (it stops the train), then the others
      params: {others: [acquisition, telemetry, propulsion, piezo]}
      steps:
        - {id: stop_pilot, slot: pilot, do: stop}
        - {id: stop_others, for_each: "{{ params.others }}", do: stop, needs: [stop_pilot]}

  phases:

    - id: test_run
      stage_slots: [train]                            # CALC-Pilot, CALC-TM, AU, switch: their lab stage locked as one
      slots: [propulsion, piezo]                 # ad hoc slots, on the lab server
      steps:
        - {id: up, uses: bring_up}
        # the scenario runs by itself (pilot profile, simulated contacts): just let it run
        - {id: run, delay: "{{ scenario.duration_s }}s", needs: [up]}
        - {id: down, uses: shut_down, needs: [run]}
      finally:                                   # always, even on cancel or kill
        - {id: kill_leftovers, for_each: slots, do: kill, if: "not succeeded('down')"}
        - {id: collect, for_each: slots, do: collect}   # outputs join the results datapack

    - id: exploit
      needs: [test_run]
      slots: [analysis]                          # the lab server (role sequencer), never locked
      inputs:                                    # outputs of the test run become exploitation inputs
        - {from: "test_run:telemetry/output/telemetry.csv", to: "analysis/input/data/"}
        - {from: "test_run:propulsion/output/propulsion.propj", to: "analysis/input/data/"}
        - {from: "test_run:piezo/output/piezo.csv", to: "analysis/input/data/"}
      steps:
        - {id: deploy, slot: analysis, do: deploy}
        # a Python step (README section 8.3): the collected data is complete, or the test run lost some
        - id: check_data
          slot: analysis
          needs: [deploy]
          python:
            script: "{{ slot.input_dir }}/check_data.py"
            args: ["{{ slot.input_dir }}/data", "{{ slot.output_dir }}"]
        # exploit_runner on the criteria: exit 0 when they are met, the test failed otherwise
        - id: analyse
          slot: analysis
          needs: [check_data]
          run: "exploit_runner {{ slot.input_dir }}/exploit.yml"
          timeout: 15m
          expect: {exit: [0]}
      finally:
        - {id: collect, slot: analysis, do: collect}
