# Lab components of the toy-train lab (sequencer README, section 7.2): how each kind of hardware
# implements the commands of the roles (roles/toytrain.yml), how it is monitored and self-tested.
# Inventory hosts are components extending these (tsq_extends). What a given test deploys is in the
# datapack setup (its component_types: inputs only).
#
# Assumed on the targets (prepared once by the lab operators, not by the tests):
# - an account 'tsq' with the lab key, and sudo rights limited to the commands below;
# - the toy-train software installed as systemd services, configured from <remote_root>/<component>/input/.

components:

  arduino_unoq:
    # Arduino UNO Q: Debian on its MPU (reached over SSH like any Linux system) and a microcontroller
    # running the real-time part of the application. Ethernet through a W5500 module.
    extends: linux_system
    description: Arduino UNO Q (Debian MPU and microcontroller)
    commands:
      # flash the microcontroller part from the deployed inputs (assumed helper of the toy-train software)
      install: {run: "sudo /usr/local/bin/toytrain-install --input {{ component.input_dir }}", timeout: 2m}
      start:   {run: "sudo systemctl start toytrain-{{ component.role }}", timeout: 30s}
      stop:    {run: "sudo systemctl stop toytrain-{{ component.role }}", timeout: 30s}
      kill:    {run: "sudo systemctl kill --signal=KILL toytrain-{{ component.role }}; sudo /usr/local/bin/toytrain-install --halt-mcu"}
      ready:   {wait_for: {log: {file: "{{ component.output_dir }}/app.log", regex: "READY"}, timeout: 30s}}
      version: {run: "/usr/local/bin/toytrain-install --version"}   # recorded in the results baseline
    selftest:                          # added to linux_system's checks (SSH, remote_root, disk, clock)
      - {id: mcu_link, run: "sudo /usr/local/bin/toytrain-install --check", timeout: 20s}
    status:
      probe: {run: "systemctl is-active toytrain-{{ component.role }}; cat /run/toytrain/state 2>/dev/null"}
      interval: 10s
      states:
        broken:     {regex: "FAULT"}
        running:    {regex: "^active"}
        configured: {regex: "^inactive[\\s\\S]*CONFIGURED"}
        idle:       {regex: "^inactive"}

  rpi5:
    # Raspberry Pi 5, Raspberry Pi OS: plain Linux system with the toy-train services.
    extends: linux_system
    description: Raspberry Pi 5 with the toy-train services
    commands:
      start:   {run: "sudo systemctl start toytrain-{{ component.role }}", timeout: 30s}
      stop:    {run: "sudo systemctl stop toytrain-{{ component.role }}", timeout: 30s}
      kill:    {run: "sudo systemctl kill --signal=KILL toytrain-{{ component.role }}"}
      ready:   {wait_for: {log: {file: "{{ component.output_dir }}/app.log", regex: "READY"}, timeout: 30s}}
      version: {run: "toytrain-{{ component.role }} --version"}
    selftest:
      - {id: service_installed, run: "systemctl cat toytrain-{{ component.role }} > /dev/null"}
    status:
      probe: {run: "systemctl is-active toytrain-{{ component.role }}"}
      interval: 10s
      states:
        running: {regex: "^active"}
        broken:  {regex: "^failed"}
        idle:    {regex: "^inactive"}

  auvidea_m82:
    # Auvidea M82 Ethernet switch: not configured by the tests, only monitored.
    # Probed from the sequencer host, so its transport is local.
    extends: component
    description: Auvidea M82 Ethernet switch
    transport: local
    # self-test: the inherited 'component' check, its status probe (a ping) answers
    status:
      probe: {run: "ping -c 1 -W 1 {{ component.host }}"}
      interval: 30s
      states:
        running: {exit: 0}
        offline: {exit: nonzero}

  toytrain_sim:
    # Simulation processes on the lab server (python, from the toy-train test repository).
    # Each one runs as a transient systemd unit started by the sequencer (README, section 11).
    extends: linux_system
    description: A simulation process on the lab server
    commands:
      stop:    {signal: TERM, timeout: 10s}
      ready:   {wait_for: {log: {file: "{{ component.output_dir }}/sim.log", regex: "READY"}, timeout: 20s}}
      version: {run: "{{ remote_root }}/venv/bin/toytrain-sim --version"}
    selftest:
      - {id: sim_installed, run: "{{ remote_root }}/venv/bin/toytrain-sim --version"}

  propulsion_sim:
    # the simulated propulsion controller, from the inputs a datapack deploys (sim/, propulsion_sim.yml)
    extends: toytrain_sim
    commands:
      start: {run: "{{ remote_root }}/venv/bin/toytrain-sim propulsion --config {{ component.input_dir }}/propulsion_sim.yml --out {{ component.output_dir }}", detach: true}
    selftest:
      - {id: propulsion_address, run: "ip -o addr show | grep -q ' {{ component.vars.tsq_sim_address }}/'"}

  piezo_sim:
    # the simulated piezo sensors, from the inputs a datapack deploys (sim/, piezo_sim.yml)
    extends: toytrain_sim
    commands:
      start: {run: "{{ remote_root }}/venv/bin/toytrain-sim piezo --config {{ component.input_dir }}/piezo_sim.yml --gpio {{ component.vars.tsq_gpio_adapter }} --out {{ component.output_dir }}", detach: true}
    selftest:
      - {id: gpio_adapter, run: "test -e {{ component.vars.tsq_gpio_adapter }}"}
