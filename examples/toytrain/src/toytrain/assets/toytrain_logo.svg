<svg class="tt-logo" id="toytrain-logo" xmlns="http://www.w3.org/2000/svg" width="300" height="76" viewBox="0 0 300 76" role="img" aria-label="Toy Train">
  <style>
    .tt-logo { display:block; margin:0 auto 12px auto; }
    .tt-logo .train { animation:tt-roll 1.6s ease-out 1; }
    .tt-logo .body { fill:#d9473b; }
    .tt-logo .cab { fill:#2b5d8a; }
    .tt-logo .wheel { fill:#333; }
    .tt-logo .rail { stroke:#888; stroke-width:2; }
    .tt-logo .name { font:bold 30px Arial, sans-serif; fill:#2b5d8a; }
    .tt-logo .sub { font:14px Arial, sans-serif; fill:#666; letter-spacing:3px; }
    @keyframes tt-roll { from { transform:translateX(-60px); opacity:0; } to { transform:translateX(0); opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      .tt-logo * { animation:none !important; }
    }
  </style>
  <line class="rail" x1="4" y1="60" x2="76" y2="60"/>
  <g class="train">
    <rect class="body" x="8" y="30" width="40" height="20" rx="3"/>
    <rect class="cab" x="48" y="20" width="22" height="30" rx="3"/>
    <rect class="body" x="16" y="20" width="8" height="10"/>
    <circle class="wheel" cx="20" cy="53" r="6"/>
    <circle class="wheel" cx="40" cy="53" r="6"/>
    <circle class="wheel" cx="60" cy="53" r="6"/>
  </g>
  <text class="name" x="84" y="42">Toy Train</text>
  <text class="sub" x="86" y="62">TEST REPORT</text>
</svg>
