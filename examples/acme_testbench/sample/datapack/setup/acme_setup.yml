id: acme_bench

dictionaries:
  - globals.yml

datarepositories:
  - id: acme_data
    name: ACME bench data
    # where datasets are imported
    path: "{{ testdef.path }}/../../../.work/datarepo"
    datasources:
      - id: calib_store
        name: ACME calibration store
        # the datapack importer registered by acme_testbench's plugin
        importer: acme-archive
        # the archive store: one <version>.zip or <version>/ folder per dataset version
        source: "{{ testdef.path }}/../archive_store"
        datasets:
          - id: bench_calib
            version: "{{ bench_calib_version }}"

component_types:
  bench_controller:
    configurations:
      standard:
        inputs:
          # rendered with the keys of the imported dataset (dataset.yml)
          - source: templates/bench_config.yml
            target: bench_config.yml
          # copied as is from the imported dataset
          - source: "{{ bench_calib.path }}/calibration.yml"
            target: calibration.yml
            method: copy

configurations:
  nominal:
    components:
      bench_a:
        name: Bench A controller
        type: bench_controller
        configuration: standard
