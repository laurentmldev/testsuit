[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-testbench"
version = "0.1.0"
description = "Example library extending testsuit: bench file formats, mexploit criteria, a datapack importer and a report logo"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    # outside this repo: "testsuit @ git+https://github.com/laurentmldev/testsuit"
    "testsuit",
    "numpy",
    "pandas",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
acme-bench = "acme_testbench.cli:main"

# how testsuit finds this package's registrations, in every process and command-line tool
[project.entry-points."testsuit.plugins"]
acme_testbench = "acme_testbench.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acme_testbench = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
