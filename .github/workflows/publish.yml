name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist to job artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Get TestPyPI token
        id: get_testpypi_token
        run: |
          response=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=test.pypi.org")
          echo "id_token=$(echo "$response" | jq -r .value)" >> "$GITHUB_OUTPUT"

      - name: Publish to TestPyPI
        env:
          TWINE_NON_INTERACTIVE: 1
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ steps.get_testpypi_token.outputs.id_token }}
        run: |
          python -m pip install twine
          python -m twine upload --verbose --repository testpypi dist/*

      - name: Get PyPI token
        id: get_pypi_token
        run: |
          response=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi")
          echo "id_token=$(echo "$response" | jq -r .value)" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        env:
          TWINE_NON_INTERACTIVE: 1
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ steps.get_pypi_token.outputs.id_token }}
        run: |
          python -m pip install twine
          python -m twine upload --repository pypi dist/*