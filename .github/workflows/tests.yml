name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (runtime errors and bug-prone patterns, see [tool.ruff] in pyproject.toml)
        run: |
          python -m pip install ruff
          ruff check .

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a hung test fails the job instead of blocking it for hours
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs history/tags for the version
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  example:
    # examples/toytrain: a separate package extending testsuit through its plugin entry point
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install testsuit and the example
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e "examples/toytrain[test]"
      - name: Run the example's tests
        working-directory: examples/toytrain
        run: python -m pytest -q

  ui:
    # the web UI: typecheck and build, then every page and editor view rendered in Chrome against the testsuit
    # app with both modes on: its tsqd running the toy-train example (emulated lab) with the Editor on
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Typecheck and build
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Install testsuit and the toy-train example
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sequencer]" -e examples/toytrain
      - name: Start testsuit (both modes, tsqd with its Editor, the exploit mode on the example)
        run: |
          mkdir -p "$RUNNER_TEMP/tsq"
          cat > "$RUNNER_TEMP/tsq/tsq.yml" <<EOF
          lab: {folder: $GITHUB_WORKSPACE/examples/toytrain/lab, inventory: toytrain_emulated.yml, require_tag: false}
          storage: {root: $RUNNER_TEMP/tsq/storage, min_free_space: 100MB}
          server: {editor: true, workspaces: [$GITHUB_WORKSPACE/examples/toytrain/datapack]}
          plugins: [toytrain]
          EOF
          cat > "$RUNNER_TEMP/testsuit.toml" <<EOF
          modes = ["sequencer", "exploit"]
          [ui]
          listen = "127.0.0.1:8650"
          browser = false
          [exploit]
          folder = "$GITHUB_WORKSPACE/examples/toytrain/datapack"
          [sequencer]
          config = "$RUNNER_TEMP/tsq/tsq.yml"
          EOF
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          nohup testsuit --config "$RUNNER_TEMP/testsuit.toml" > "$RUNNER_TEMP/testsuit.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8650/seq/health > /dev/null && break; sleep 1; done
      - name: Render every view
        working-directory: ui
        env:
          TESTSUIT_URL: http://127.0.0.1:8650
          CHROMIUM: /usr/bin/google-chrome
        run: npm run e2e
      - name: testsuit and tsqd logs
        if: always()
        run: |
          cat "$RUNNER_TEMP/testsuit.log"
          cat "$RUNNER_TEMP/config/testsuit/tsqd.log" || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web UI (into src/testsuit/app/ui, packaged with the testsuit app)
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          python -m zipfile -l dist/*.whl | grep -q "testsuit/app/ui/index.html"
