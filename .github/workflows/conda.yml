# The conda package of testsuit (conda/meta.yaml), shown as the "testsuit" app (the mexploit web UI) in Anaconda Navigator once
# installed. Not published anywhere: the job keeps the package, in a local channel folder, as the artifact
# "testsuit-conda-channel" of the run (on a v* tag, a pull request changing it, or by hand from the Actions
# tab). Install it from that folder: README.md, "From Anaconda Navigator".
# The job installer then builds the Windows installer from that channel (conda/installer/construct.yaml), kept as
# the artifact "testsuit-<version>-Windows-x86_64.exe" (the .exe itself, not zipped): README.md, "Windows installer".
name: conda

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "conda/**"
      - ".github/workflows/conda.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conda:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sdist.outputs.version }}
    defaults:
      run:
        shell: bash -el {0}   # a login shell: the conda environment is activated
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs history/tags for the version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the web UI (packaged with the sequencer)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist (with the web UI)
        id: sdist
        run: |
          python -m pip install --upgrade build setuptools-scm
          python -m build --sdist
          version=$(python -m setuptools_scm)
          echo "TESTSUIT_VERSION=$version" >> "$GITHUB_ENV"
          echo "TESTSUIT_SDIST=$PWD/dist/testsuit-$version.tar.gz" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
      - name: Build the conda package
        run: |
          conda install -n base -y conda-build   # a conda subcommand: in the base environment
          conda build conda --output-folder conda-out
          rm -rf conda-out/src_cache
          ls conda-out/noarch

      # Navigator shows a package of a local channel with the icon that channeldata.json names (icon_url, relative
      # to the channel folder), before it is installed; without one, the Anaconda default icon
      - name: Give the package its icon in the channel
        run: |
          mkdir -p conda-out/icons
          cp conda/icon.png conda-out/icons/testsuit.png
          python - <<'EOF'
          import json, pathlib
          path = pathlib.Path("conda-out/channeldata.json")
          data = json.loads(path.read_text()) if path.is_file() else {"channeldata_version": 1, "packages": {}}
          data.setdefault("packages", {}).setdefault("testsuit", {})["icon_url"] = "icons/testsuit.png"
          path.write_text(json.dumps(data, indent=2))
          EOF

      # conda-out is a local channel (its repodata.json is written by conda build): unzipped anywhere,
      # conda installs from it, with the dependencies from conda-forge
      - name: Keep the package as a local channel
        uses: actions/upload-artifact@v4
        with:
          name: testsuit-conda-channel
          path: conda-out/
          retention-days: 90

  # The Windows installer: one .exe with its own Python, testsuit (from the channel above) and its dependencies
  # (from conda-forge), installed offline with a Start-menu shortcut. Built on Windows (NSIS).
  installer:
    needs: conda
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      TESTSUIT_VERSION: ${{ needs.conda.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: testsuit-conda-channel
          path: conda-out

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
      - name: Build the installer
        run: |
          conda install -n base -y constructor conda-standalone
          # the NSIS installer shows a .txt or .rtf license
          cp LICENSE conda/installer/LICENSE.txt
          export TESTSUIT_CHANNEL="file:///$(cygpath -m "$PWD/conda-out")"
          conda run -n base constructor conda/installer --output-dir installer-out
          ls -l installer-out

      # the .exe as is, not zipped (archive: false): the artifact is named after it,
      # testsuit-<version>-Windows-x86_64.exe
      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          path: installer-out/*.exe
          archive: false
          retention-days: 90
