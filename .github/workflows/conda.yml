# The conda package of testsuit (conda/meta.yaml), shown as the "mexploit" app in Anaconda Navigator.
# On a pull request changing it: built and tested only. On a v* tag: also uploaded to the anaconda.org
# channel of the ANACONDA_API_TOKEN secret (no secret: the upload is skipped). Users add that channel
# in Navigator (Channels, Add: https://conda.anaconda.org/<channel>), then install mexploit from Home.
name: conda

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "conda/**"
      - ".github/workflows/conda.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conda:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # a login shell: the conda environment is activated
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs history/tags for the version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the web UI (packaged with the sequencer)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist (with the web UI)
        run: |
          python -m pip install --upgrade build setuptools-scm
          python -m build --sdist
          version=$(python -m setuptools_scm)
          echo "TESTSUIT_VERSION=$version" >> "$GITHUB_ENV"
          echo "TESTSUIT_SDIST=$PWD/dist/testsuit-$version.tar.gz" >> "$GITHUB_ENV"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
      - name: Build the conda package
        run: |
          conda install -y conda-build anaconda-client
          conda build conda --output-folder conda-out
          ls conda-out/noarch

      - name: Upload to anaconda.org
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          if [ -z "$ANACONDA_API_TOKEN" ]; then
            echo "no ANACONDA_API_TOKEN secret: the package is not uploaded"
            exit 0
          fi
          anaconda upload --skip-existing conda-out/noarch/testsuit-*
