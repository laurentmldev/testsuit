[build-system]
requires = ["setuptools==80.9.0", "setuptools-scm==9.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testsuit"
description = "Toolbox for preparing and analysing tests data, based on Pandas mainly."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Laurent Millet-Lacombe" }]
keywords = ["test data", "hdf5", "tdms", "mdf", "csv", "data analysis", "test campaign"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]  # version can't be determined statically (git tags are our source of truth)
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "GitPython>=3.1",
    "colorama>=0.4",
    "h5py>=3.15",
    "Unidecode>=1.4",
    "pytest-html>=4.1",
    "pytest-metadata>=3.1",
    "matplotlib>=3.10",
    "asammdf>=8.7",
    "pytest>=8",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "Markdown>=3.5",
    "python-dateutil>=2.8",
    "npTDMS>=1.10",
    "dwdatareader>=1.3"
]

[project.optional-dependencies]
plotly = ["plotly>=5"]
# nbclassic: the GUIs drive cells through the classic notebook JavaScript API
jupyter = ["ipython>=8", "ipywidgets>=8", "nbclassic>=1.0"]
influxdb = ["influxdb-client>=1.40", "influxdb3-python>=0.10", "pyarrow>=15"]
# what the test suite needs on top of the runtime deps: pip install -e ".[test]"
test = ["plotly>=5"]
# contributor tooling: pip install -e ".[dev]"
dev = ["testsuit[test]", "build>=1.3", "ruff>=0.6"]

[project.scripts]
data2h5 = "testsuit.cli.data2h5:main"
data2db = "testsuit.cli.data2db:main"
extract_data_any = "testsuit.cli.extract_data_any:main"
extract_data_flags = "testsuit.cli.extract_data_flags:main"
apply_clock_correction = "testsuit.cli.apply_clock_correction:main"
mxp = "testsuit.cli.mxp:main"
exploit_runner = "testsuit.cli.exploit_runner:main"
datapack = "testsuit.cli.datapack:main"
testsuit-notebooks = "testsuit.cli.notebooks:main"
evalfile = "testsuit.cli.evalfile:main"

[project.urls]
Homepage = "https://github.com/laurentmldev/testsuit"
Source = "https://github.com/laurentmldev/testsuit"
Issues = "https://github.com/laurentmldev/testsuit/issues"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest-html>=4.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
# test modules are named *_t.py; restrict collection to tests/ so the
# mexploit conftest under src/ is not loaded as a plugin
testpaths = ["tests"]
python_files = ["*_t.py"]

# dynamic way of determining version using git tags (to confirm which version is being infered: "python3 -m setuptools_scm")
[tool.setuptools.package-data]
# starter notebooks copied by the testsuit-notebooks command
"testsuit.jupytertools.notebooks" = ["*.ipynb"]

[tool.setuptools_scm]
root = "."  # ".git" is in the parent directory

[tool.ruff.lint]
# errors that break at runtime (syntax errors, undefined names), plus bug-prone patterns
# the code base is now clean of: bare except, mutable/call defaults, redefinitions,
# type() comparisons, loop variables captured by closures. Style rules can follow.
select = ["E9", "F63", "F7", "F82", "E721", "E722", "F811", "B006", "B008", "B023"]
