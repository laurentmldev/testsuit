[build-system]
requires = ["setuptools==80.9.0", "setuptools-scm==9.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testsuit"
description = "Toolbox for preparing and analysing tests data"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]  # version can't be determined statically (git tags are our source of truth)
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "setuptools<81",
    "six>=1.17.0",
    "typing>=3.7",
    "GitPython>=3.1",
    "colorama>=0.4",
    "h5py>=3.15",
    "Unidecode>=1.4",
    "pytest-html>=4.1",
    "pytest-metadata>=3.1",
    "matplotlib>=3.10",
    "asammdf>=8.7"
]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest-env>=1.2.0",
    "pytest-html>=4.1.1",
    "responses>=0.25.8",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
env = [
    #"SHADOX_USERNAME=myusername",
    #"SHADOX_PWD=mypassword"
]

# dynamic way of determining version using git tags (to confirm which version is being infered: "python3 -m setuptools_scm")
[tool.setuptools_scm]
root = "."  # ".git" is in the parent directory
