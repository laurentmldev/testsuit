[build-system]
requires = ["setuptools==80.9.0", "setuptools-scm==9.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testsuit"
description = "Toolbox for preparing and analysing tests data"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]  # version can't be determined statically (git tags are our source of truth)
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "setuptools<81",
    "six>=1.17.0",
    "GitPython>=3.1",
    "colorama>=0.4",
    "h5py>=3.15",
    "Unidecode>=1.4",
    "pytest-html>=4.1",
    "pytest-metadata>=3.1",
    "matplotlib>=3.10",
    "asammdf>=8.7",
    "pytest>=8",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "Markdown>=3.5",
    "python-dateutil>=2.8"
]

[project.optional-dependencies]
plotly = ["plotly>=5"]
word = ["python-docx>=1.1", "docxtpl>=0.16", "Jinja2>=3.1"]
jupyter = ["ipython>=8", "ipywidgets>=8"]
influxdb = ["influxdb-client>=1.40", "influxdb3-python>=0.10", "pyarrow>=15"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest-env>=1.2.0",
    "pytest-html>=4.1.1",
    "responses>=0.25.8",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
# test modules are named *_t.py; restrict collection to tests/ so the
# mexploit conftest under src/ is not loaded as a plugin
testpaths = ["tests"]
python_files = ["*_t.py"]
env = [
    #"SHADOX_USERNAME=myusername",
    #"SHADOX_PWD=mypassword"
]

# dynamic way of determining version using git tags (to confirm which version is being infered: "python3 -m setuptools_scm")
[tool.setuptools_scm]
root = "."  # ".git" is in the parent directory
